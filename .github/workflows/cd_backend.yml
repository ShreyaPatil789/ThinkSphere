##Build the docker image
## Push the docker image to docker hub
## SSH into our VM and start the new image 


name: Deploy to EC2 using Docker

on:
  push:
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v2

      - name: Docker Login
        uses: docker/login-action@v2 ##docker login
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: ./ThinkSphere-backend
          file: ./ThinkSphere-backend/Dockerfile
          push: true
          tags: thinksphere/thinksphere-backend:${{ github.sha }}